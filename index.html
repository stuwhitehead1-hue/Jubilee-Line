<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Jubilee Line Status</title> <style> html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #6A7278; /* Jubilee line grey */ } .wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; } .line { color: white; font-size: 4vw; font-weight: 700; letter-spacing: 0.3vw; margin-bottom: 2vh; } .status { color: white; font-size: 8vw; font-weight: 900; text-align: center; padding: 2vh 4vw; } .updated { position: absolute; bottom: 1vh; right: 1vw; color: rgba(255,255,255,0.7); font-size: 1vw; } </style> </head> <body> <div class="wrapper"> <div class="line">JUBILEE LINE</div> <div id="status" class="status">LOADING...</div> </div> <div id="updated" class="updated"></div> <script> async function updateStatus() { try { const response = await fetch( 'https://api.tfl.gov.uk/Line/Jubilee/Status' ); const data = await response.json(); const status = data[0]?.lineStatuses?.[0]?.statusSeverityDescription || 'UNKNOWN'; document.getElementById('status').textContent = status.toUpperCase(); document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString(); } catch (e) { document.getElementById('status').textContent = 'STATUS UNAVAILABLE'; } } updateStatus(); setInterval(updateStatus, 60000); </script> </body> </html>
